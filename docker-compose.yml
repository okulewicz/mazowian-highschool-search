services:
  transport-data:
    build:
      context: .
      dockerfile: components/transport-data/Dockerfile
    environment:
      SNAPSHOT_ROOT: /data/transport
    volumes:
      - ./.data:/data
    profiles: ["jobs"]

  otp:
    image: opentripplanner/opentripplanner:2.10.0@sha256:8d54e5c589186707ee365417f2202dc878c451fa3001b8edff07019531100933
    command: ["--load", "/var/otp/graphs/active"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./.data/routing:/var/otp/graphs:ro
    restart: unless-stopped
